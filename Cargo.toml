[package]
name = "vinny"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Native VNC server for macOS"
license = "Apache-2.0"
repository = "https://github.com/sarimabbas/vinny"
readme = "README.md"
keywords = ["macos", "vnc", "rfb", "screencapturekit"]
categories = ["network-programming"]

[dependencies]
enigo = { version = "0.6.1", default-features = false }
objc2-application-services = { version = "0.3.2", features = ["AXUIElement", "HIServices"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGDirectDisplay", "CGWindow"] }
rustvncserver = { path = "vendor/rustvncserver" }
screencapturekit = "8.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
lto = "thin"
strip = true
