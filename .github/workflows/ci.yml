name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup default 1.90.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --manifest-path vendor/rustvncserver/Cargo.toml --locked
      - run: cargo test --manifest-path vendor/rfb-encodings/Cargo.toml --locked --lib
      - run: cargo clippy --locked --all-targets -- -D warnings
