name: Growth snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: growth-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download previous successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous growth
          previous_run=$(gh run list --workflow growth.yml --branch "$DEFAULT_BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name vinny-growth-snapshot --dir previous
          elif [ "$GH_REPO" = 'sarimabbas/vinny' ]; then
            cp docs/growth/baseline-2026-09-05.json previous/snapshot.json
          fi
      - name: Capture public GitHub counters
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          previous_args=()
          if [ -f previous/snapshot.json ]; then
            previous_args=(--previous previous/snapshot.json)
          fi
          python3 scripts/growth_snapshot.py --repo "$GH_REPO" "${previous_args[@]}" --output growth/snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vinny-growth-snapshot
          path: growth/snapshot.json
          if-no-files-found: error
          retention-days: 90
